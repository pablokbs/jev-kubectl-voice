# Demo: voice control of Kubernetes.
# We speak English -> Jev interprets the command -> kubectl scale -> this Deployment.
# The backend uses the current kubeconfig context to read and scale this resource.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-voice
  namespace: default
  labels:
    app: nginx-voice
spec:
  # Talk baseline: the voice commands scale from here (low:1, normal:3, high:10)
  replicas: 3
  selector:
    matchLabels:
      app: nginx-voice
  template:
    metadata:
      labels:
        app: nginx-voice
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          # Artificial readiness delay ~1s: the orange squares stay visible
          # because the UI polls every 500ms (2-4 orange polls per pod).
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
