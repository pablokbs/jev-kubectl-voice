<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voz → Jev → Kubernetes — demo en vivo</title>
    <!-- Sin dependencias externas: todo local, la wifi del venue no se puede confiar. -->
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <!-- 1. Cabecera: título de la demo + pill de estado backend/cluster -->
    <header class="cabecera">
      <h1 class="titulo">Voz → Jev → Kubernetes</h1>
      <div id="status-pill" class="pill pill-conectando">
        <span class="pill-punto"></span>
        <span id="status-texto">conectando…</span>
      </div>
    </header>

    <main class="principal">
      <!-- Columna izquierda: micrófono + lo que dije -->
      <div class="columna col-izquierda">
        <!-- 2. Control de micrófono (principal, a la izquierda) -->
        <section class="panel panel-micro" aria-label="Control de micrófono">
          <button
            id="mic-button"
            class="micro"
            type="button"
            aria-label="Hablar: pulsar para dictar un comando"
            title="Pulsá y hablá (es-ES)"
          >
            <span class="micro-icono" aria-hidden="true">🎙️</span>
          </button>
          <div class="micro-lateral">
            <div class="entrada-fila">
              <input
                id="text-input"
                class="entrada"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="…o escribí el comando acá y apretá Enter"
                aria-label="Comando de texto"
              />
              <button id="send-button" class="boton-enviar" type="button">Enviar</button>
            </div>
            <p id="mic-hint" class="micro-hint">Pulsá el micro y hablá.</p>
          </div>
        </section>

        <!-- 3. Panel "Lo que dije": transcripción final grande, interina más tenue -->
        <section class="panel panel-transcripcion" aria-label="Lo que dije">
          <h2 class="panel-titulo">Lo que dije</h2>
          <div id="transcript" class="transcripcion">
            <span class="vacio">todavía no dijiste nada…</span>
          </div>
        </section>
      </div>

      <!-- Columna derecha: pensamiento de Jev + contador de pods -->
      <div class="columna col-derecha">
        <!-- 4. Panel "El pensamiento de Jev": barras de probabilidad + confianza -->
        <section class="panel panel-pensamiento" aria-label="El pensamiento de Jev">
          <h2 class="panel-titulo">El pensamiento de Jev</h2>
          <div id="thinking" class="pensamiento">
            <p class="vacio">Jev aún no pensó nada — mandá un comando y mirá cómo decide.</p>
          </div>
          <!-- Línea de timing: "⚡ Jev decidió en N ms", la pinta app.js con classify_ms. -->
          <p id="jev-timing" class="jev-timing" hidden></p>
        </section>

        <!-- 5. Contador de pods: cuadraditos (uno por pod) + leyenda + subline listos/total -->
        <section class="panel panel-pods" aria-label="Réplicas en el cluster">
          <h2 class="panel-titulo">
            Kubernetes · <span id="pod-deployment">nginx-voice</span>
          </h2>
          <div class="pods-fila">
            <div id="pod-count" class="pods-cuadricula" aria-live="polite">
              <span class="pods-vacio">—</span>
            </div>
          </div>
          <div class="pods-leyenda">
            <span class="leyenda">
              <span class="leyenda-cuadro pod-square--running"></span>corriendo
            </span>
            <span class="leyenda">
              <span class="leyenda-cuadro pod-square--starting"></span>arrancando
            </span>
            <span class="leyenda">
              <span class="leyenda-cuadro pod-square--terminating"></span>muriendo
            </span>
          </div>
          <p id="pod-ready" class="pods-subline">&nbsp;</p>
        </section>
      </div>
    </main>

    <!-- 4b. Registro de acciones: últimos 5 eventos, el más nuevo primero -->
    <section class="panel panel-log" aria-label="Registro de acciones">
      <h2 class="panel-titulo">Registro de acciones</h2>
      <ol id="action-log" class="log">
        <li class="log-vacio">todavía no pasó nada…</li>
      </ol>
    </section>
  </body>
</html>
