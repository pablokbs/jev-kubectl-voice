<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice → Jev → Kubernetes — live demo</title>
    <!-- No external dependencies: everything is local, the venue wifi can't be trusted. -->
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <!-- 1. Header: demo title + backend/cluster status pill -->
    <header class="cabecera">
      <h1 class="titulo">Voice → Jev → Kubernetes</h1>
      <div id="status-pill" class="pill pill-conectando">
        <span class="pill-punto"></span>
        <span id="status-texto">connecting…</span>
      </div>
    </header>

    <main class="principal">
      <!-- Left column: microphone + what I said -->
      <div class="columna col-izquierda">
        <!-- 2. Microphone control (main, on the left) -->
        <section class="panel panel-micro" aria-label="Microphone control">
          <button
            id="mic-button"
            class="micro"
            type="button"
            aria-label="Speak: press to dictate a command"
            title="Press and speak (en-US)"
          >
            <span class="micro-icono" aria-hidden="true">🎙️</span>
          </button>
          <div class="micro-lateral">
            <div class="entrada-fila">
              <input
                id="text-input"
                class="entrada"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="…or type the command here and press Enter"
                aria-label="Text command"
              />
              <button id="send-button" class="boton-enviar" type="button">Send</button>
            </div>
            <p id="mic-hint" class="micro-hint">Press the mic and speak.</p>
          </div>
        </section>

        <!-- 3. "What I said" panel: big final transcript, dimmer interim -->
        <section class="panel panel-transcripcion" aria-label="What I said">
          <h2 class="panel-titulo">What I said</h2>
          <div id="transcript" class="transcripcion">
            <span class="vacio">you haven't said anything yet…</span>
          </div>
        </section>
      </div>

      <!-- Right column: Jev's thinking + pod counter -->
      <div class="columna col-derecha">
        <!-- 4. "Jev's thinking" panel: probability bars + confidence -->
        <section class="panel panel-pensamiento" aria-label="Jev's thinking">
          <h2 class="panel-titulo">Jev's thinking</h2>
          <div id="thinking" class="pensamiento">
            <p class="vacio">Jev hasn't thought yet — send a command and watch it decide.</p>
          </div>
          <!-- Timing line: "⚡ Jev decided in N ms", painted by app.js from classify_ms. -->
          <p id="jev-timing" class="jev-timing" hidden></p>
        </section>

        <!-- 5. Pod counter: squares (one per pod) + legend + ready/total subline -->
        <section class="panel panel-pods" aria-label="Replicas in the cluster">
          <h2 class="panel-titulo">
            Kubernetes · <span id="pod-deployment">nginx-voice</span>
          </h2>
          <div class="pods-fila">
            <div id="pod-count" class="pods-cuadricula" aria-live="polite">
              <span class="pods-vacio">—</span>
            </div>
          </div>
          <div class="pods-leyenda">
            <span class="leyenda">
              <span class="leyenda-cuadro pod-square--running"></span>running
            </span>
            <span class="leyenda">
              <span class="leyenda-cuadro pod-square--starting"></span>starting
            </span>
            <span class="leyenda">
              <span class="leyenda-cuadro pod-square--terminating"></span>terminating
            </span>
          </div>
          <p id="pod-ready" class="pods-subline">&nbsp;</p>
        </section>
      </div>
    </main>

    <!-- 4b. Action log: last 5 events, newest first -->
    <section class="panel panel-log" aria-label="Action log">
      <h2 class="panel-titulo">Action log</h2>
      <ol id="action-log" class="log">
        <li class="log-vacio">nothing has happened yet…</li>
      </ol>
    </section>
  </body>
</html>
