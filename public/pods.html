<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Estado del cluster</title>
    <!-- Pantalla secundaria: solo los cuadraditos de pods, sin controles de la demo principal. -->
    <link rel="stylesheet" href="/style.css" />
    <style>
      /*
       * Overrides mínimos solo para esta página (style.css queda intacto):
       * la cuadrícula ocupa el ancho completo y los cuadrados se ven más
       * grandes para el proyector.
       */
      .principal {
        grid-template-columns: 1fr;
      }

      .pods-cuadricula {
        min-height: clamp(140px, 34vh, 380px);
        gap: 12px;
      }

      .pod-square {
        width: clamp(40px, 7vw, 104px);
        height: clamp(40px, 7vw, 104px);
        border-radius: 10px;
      }

      .pods-subline {
        font-size: clamp(1.6rem, 2.6vw, 2.4rem);
      }
    </style>
    <script src="/pods.js" defer></script>
  </head>
  <body>
    <!-- Cabecera: título neutro + pill de estado backend/cluster -->
    <header class="cabecera">
      <h1 class="titulo">Estado del cluster</h1>
      <div id="status-pill" class="pill pill-conectando">
        <span class="pill-punto"></span>
        <span id="status-texto">conectando…</span>
      </div>
    </header>

    <main class="principal">
      <!-- Cuadrícula de pods: un cuadrado por pod + leyenda + subline listos/total -->
      <section class="panel panel-pods" aria-label="Réplicas en el cluster">
        <div class="pods-fila">
          <div id="pod-count" class="pods-cuadricula" aria-live="polite">
            <span class="pods-vacio">—</span>
          </div>
        </div>
        <div class="pods-leyenda">
          <span class="leyenda">
            <span class="leyenda-cuadro pod-square--running"></span>corriendo
          </span>
          <span class="leyenda">
            <span class="leyenda-cuadro pod-square--starting"></span>arrancando
          </span>
          <span class="leyenda">
            <span class="leyenda-cuadro pod-square--terminating"></span>muriendo
          </span>
        </div>
        <p id="pod-ready" class="pods-subline">&nbsp;</p>
      </section>
    </main>
  </body>
</html>
