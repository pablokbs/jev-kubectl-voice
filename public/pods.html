<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cluster status</title>
    <!-- Secondary screen: only the pod squares, without the main demo's controls. -->
    <link rel="stylesheet" href="/style.css" />
    <style>
      /*
       * Minimal overrides just for this page (style.css stays untouched):
       * the grid takes the full width and the squares render bigger
       * for the projector.
       */
      .principal {
        grid-template-columns: 1fr;
      }

      .pods-cuadricula {
        min-height: clamp(140px, 34vh, 380px);
        gap: 12px;
      }

      .pod-square {
        width: clamp(40px, 7vw, 104px);
        height: clamp(40px, 7vw, 104px);
        border-radius: 10px;
      }

      .pods-subline {
        font-size: clamp(1.6rem, 2.6vw, 2.4rem);
      }
    </style>
    <script src="/pods.js" defer></script>
  </head>
  <body>
    <!-- Header: neutral title + backend/cluster status pill -->
    <header class="cabecera">
      <h1 class="titulo">Cluster status</h1>
      <div id="status-pill" class="pill pill-conectando">
        <span class="pill-punto"></span>
        <span id="status-texto">connecting…</span>
      </div>
    </header>

    <main class="principal">
      <!-- Pod grid: one square per pod + legend + ready/total subline -->
      <section class="panel panel-pods" aria-label="Replicas in the cluster">
        <div class="pods-fila">
          <div id="pod-count" class="pods-cuadricula" aria-live="polite">
            <span class="pods-vacio">—</span>
          </div>
        </div>
        <div class="pods-leyenda">
          <span class="leyenda">
            <span class="leyenda-cuadro pod-square--running"></span>running
          </span>
          <span class="leyenda">
            <span class="leyenda-cuadro pod-square--starting"></span>starting
          </span>
          <span class="leyenda">
            <span class="leyenda-cuadro pod-square--terminating"></span>terminating
          </span>
        </div>
        <p id="pod-ready" class="pods-subline">&nbsp;</p>
      </section>
    </main>
  </body>
</html>
